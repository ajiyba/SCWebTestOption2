<body>
<script>
const CONTACTS = {
  "sadeq-laqa": {
    name: "Sadeq Laqa",
    title: "Sales Director",
    company: "Software Consultancy",
    mobile: "+962 777 77 91 40",
    business: "+962 6 581 48 82",
    fax: "+962 6 581 48 83",
    website: "www.sc.com.jo",

  },
  "ibrahim-younis": {
    name: "Ibrahim Younis",
    title: "Chief Executive Officer (CEO)",
    company: "Software Consultancy",
    mobile: "+962 777 11 00 44",
    business: "+962 6 581 48 82",
    fax: "+962 6 581 48 83",
    email: "Ibrahim.younis@sc.com.jo"
  },
  "anas-abaza": {
    name: "Anas Abaza",
    title: "Sales Support Team Lead",
    company: "Software Consultancy",
    mobile: "+962 77 009 9220",
    business: "+962 6 581 48 82",
    fax: "+962 6 581 48 83",
    website: "www.sc.com.jo",
    location: "Amman, Jordan",
    email: "Anas.abaza@sc.com.jo"
  }
};
function digits(s){ return s.replace(/[^\d+]/g,""); }
function buildVCard(c){
  const parts = c.name.trim().split(" ");
  const first = parts[0] || "";
  const last = parts.slice(1).join(" ") || "";
  const L = ["BEGIN:VCARD","VERSION:3.0",`N:${last};${first};;;`,`FN:${c.name}`,`ORG:${c.company}`,`TITLE:${c.title}`];
  if(c.mobile) L.push(`TEL;TYPE=CELL,VOICE:${digits(c.mobile)}`);
  if(c.business) L.push(`TEL;TYPE=WORK,VOICE:${digits(c.business)}`);
  if(c.fax) L.push(`TEL;TYPE=WORK,FAX:${digits(c.fax)}`);
  if(c.email) L.push(`EMAIL;TYPE=INTERNET,WORK:${c.email}`);
  if(c.website) L.push(`URL:https://${c.website.replace(/^https?:\/\//,"")}`);
  if(c.location) L.push(`ADR;TYPE=WORK:;;;${c.location.split(",")[0].trim()};;;${(c.location.split(",")[1]||"").trim()}`);
  L.push("END:VCARD");
  return L.join("\r\n");
}
(function(){
  const id = new URLSearchParams(location.search).get("id");
  const c = id && CONTACTS[id];
  if(!c){ document.title = "Not found"; return; }
  const url = URL.createObjectURL(new Blob([buildVCard(c)],{type:"text/vcard;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = id + ".vcf";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
})();
</script>
</body>
</html>
